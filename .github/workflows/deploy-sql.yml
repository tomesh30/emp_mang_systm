name: Deploy SQL Schema

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Whitelist GitHub Runner IP
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          az sql server firewall-rule create \
            --resource-group rg-sql-sprint \
            --server $(echo "${{ secrets.SQL_SERVER }}" | cut -d'.' -f1) \
            --name "GitHubRunner-$RUNNER_IP" \
            --start-ip-address $RUNNER_IP \
            --end-ip-address $RUNNER_IP

      - name: Execute SQL Script
        uses: azure/sql-action@v2
        with:
          connection-string: "Server=tcp:${{ secrets.SQL_SERVER }},1433;Initial Catalog=${{ secrets.SQL_DB }};User ID=${{ secrets.SQL_USER }};Password=${{ secrets.SQL_PASSWORD }};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
          path: 'sql/schema.sql'
          action: 'run'

      - name: Remove Firewall Rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group rg-sql-sprint \
            --server $(echo "${{ secrets.SQL_SERVER }}" | cut -d'.' -f1) \
            --name "GitHubRunner-$RUNNER_IP"
