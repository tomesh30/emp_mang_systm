name: Deploy SQL Schema

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Whitelist GitHub Runner IP
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          az sql server firewall-rule create \
            --resource-group rg-sql-sprint \
            --server $(echo "${{ secrets.SQL_SERVER }}" | cut -d'.' -f1) \
            --name "GitHubRunner-$RUNNER_IP" \
            --start-ip-address $RUNNER_IP \
            --end-ip-address $RUNNER_IP

      - name: Install sqlcmd
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Execute SQL Script
        run: |
          sqlcmd \
            -S ${{ secrets.SQL_SERVER }} \
            -d ${{ secrets.SQL_DB }} \
            -U ${{ secrets.SQL_USER }} \
            -P '${{ secrets.SQL_PASSWORD }}' \
            -i sql/schema.sql \
            -C

      - name: Remove Firewall Rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group rg-sql-sprint \
            --server $(echo "${{ secrets.SQL_SERVER }}" | cut -d'.' -f1) \
            --name "GitHubRunner-$RUNNER_IP"
