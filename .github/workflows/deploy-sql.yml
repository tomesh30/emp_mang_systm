cat > .github/workflows/deploy-sql.yml << 'EOF'
name: Deploy SQL Schema

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get runner IP
        id: ip
        run: echo "ip=$(curl -s https://ifconfig.me)" >> "$GITHUB_OUTPUT"

      - name: Open firewall for runner IP
        run: |
          az sql server firewall-rule create \
            --resource-group rg-sql-sprint \
            --server sql-sprint-8842 \
            --name GitHubRunnerTemp \
            --start-ip-address ${{ steps.ip.outputs.ip }} \
            --end-ip-address ${{ steps.ip.outputs.ip }}

      - name: Install sqlcmd
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

      - name: Deploy schema
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S ${{ secrets.SQL_SERVER }} \
            -d ${{ secrets.SQL_DB }} \
            -U ${{ secrets.SQL_USER }} \
            -P ${{ secrets.SQL_PASSWORD }} \
            -i sql/schema.sql -C

      - name: Close firewall rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group rg-sql-sprint \
            --server sql-sprint-8842 \
            --name GitHubRunnerTemp
EOF
